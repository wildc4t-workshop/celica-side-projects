id: celica-side-projects
name: Celica Side Projects
repository: wildc4t-workshop/celica-side-projects
repository_type: engineering-project
status: active
phase: prototype
checkpoint: 2026-09-08

task_prefix: SIDE-
decision_prefix: DEC-SIDE-

objective: >-
  Preserve and advance optional Celica engineering projects without allowing
  exploratory work to redefine the Baseline or Street Build. Only mature side
  projects should create execution work; parked projects may retain durable
  engineering documentation and explicitly authorized passive sourcing tasks.

current_direction:
  - Use this repository as a compact index/recovery space for optional Celica R&D.
  - Keep only BBK and EPS active in the execution task system unless another concept is deliberately revived.
  - Preserve the P4 e-AWD / hybrid rear-axle concept as a documented parked project with one passive donor-watch task only.
  - For the parked e-AWD concept, use Mitsubishi Y61 rear drive + matched OEM rear inverter + Ford C-Max Hybrid non-Energi battery as the current architecture baseline.
  - Treat the Toyota Q610 as the lightweight watch-list alternative and the prior Q211/custom-regear architecture as superseded.
  - Treat ownership of hardware as evidence of available parts, not architectural commitment.
  - For safety-critical brake, steering, high-voltage, drivetrain, and suspension hardware, require controlled interfaces and verification before permanent fabrication or vehicle integration.

current_focus:
  - bbk-front-structural-verification
  - bbk-rear-architecture-selection
  - bbk-hydraulic-system-verification
  - eps-mechanical-interface-definition
  - eps-dfm-architecture

parked_projects:
  p4_eawd:
    status: parked
    durable_state: eawd/CURRENT_ARCHITECTURE.md
    trade_study: eawd/TRADE_STUDY_2026-09-08.md
    current_sources: eawd/SOURCES_CURRENT.md
    legacy_state: eawd/PROJECT.md
    legacy_sources: eawd/SOURCES.md
    next_gate: y61-package-mass-and-output-geometry-check
    dashboard_tasks: passive-donor-watch-only
    passive_task: SIDE-EAWD-001
    concept: >-
      Independent Mitsubishi Y61 electric rear axle using its matched OEM rear
      inverter and a Ford C-Max Hybrid high-power battery. Retain the stock
      7.065 reduction for launch/mid-speed performance and use a staged
      one-side inboard halfshaft disconnect to protect the motor at high road
      speed. Until that disconnect is verified, use an approximately 90 mph
      vehicle-speed limit.

interfaces:
  - celica-baseline
  - celica-street-build
  - celica-engineering-knowledge
  - celica-project-dashboard

success_criteria:
  current_bbk_phase: >-
    Recover exact hardware/CAD, verify front adapter structural design, select
    an acceptable rear architecture, and verify brake balance/master-cylinder
    sizing before releasing permanent hardware.
  current_eps_phase: >-
    Define a reproducible Celica-to-EPS mechanical interface, model the complete
    column installation, and validate the architecture on spare hardware before
    any irreversible vehicle modification.
  parked_eawd_phase: >-
    Preserve enough rationale, donor specifications, trade calculations,
    sourcing strategy, controls architecture, speed/disconnect constraints,
    development sequence, risk state, and open questions that the Y61 concept
    can be resumed later without reconstructing the project from chat history.
    Keep only SIDE-EAWD-001 as a passive donor-watch task until explicitly revived.

dashboard:
  task_file: tasks.csv
  durable_state: README.md
  agent_instructions: AGENTS.md
